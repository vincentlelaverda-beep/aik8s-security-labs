apiVersion: v1
kind: Pod
metadata:
  name: good-pod
  namespace: lab-04
  labels:
    app: good-pod
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10000
    runAsGroup: 30000
    fsGroup: 20000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: good-container
      # To pin to digest: docker inspect --format='{{index .RepoDigests 0}}' ubuntu:22.04
      # Then use: ubuntu@sha256:<digest>
      image: ubuntu:22.04
      imagePullPolicy: Always
      command: ["sleep", "infinity"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        privileged: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "250m"
          memory: "256Mi"
      livenessProbe:
        exec:
          command: ["sh", "-c", "test -d /tmp"]
        initialDelaySeconds: 5
        periodSeconds: 10
      readinessProbe:
        exec:
          command: ["sh", "-c", "test -d /tmp"]
        initialDelaySeconds: 3
        periodSeconds: 5
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
