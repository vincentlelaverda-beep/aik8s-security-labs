apiVersion: v1
kind: Namespace
metadata:
  name: lab-05
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-app
  namespace: lab-05
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerable-app
  template:
    metadata:
      labels:
        app: vulnerable-app
    spec:
      containers:
        - name: app
          image: python:3.6
          command: ["python3", "-m", "http.server", "8080"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
